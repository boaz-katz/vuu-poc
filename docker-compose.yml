services:
  postgres:
    image: postgres:17-alpine
    container_name: vuu-poc-postgres
    environment:
      POSTGRES_DB: vuu_poc
      POSTGRES_USER: vuu
      POSTGRES_PASSWORD: vuu_dev_password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vuu -d vuu_poc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
